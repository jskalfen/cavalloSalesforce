<template>
    <lightning-card title="Accounts — Needs Outreach" icon-name="standard:account">

        <div class="slds-p-horizontal_medium">
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                <div>
                    <template lwc:if={totalCount}>
                        <lightning-badge label={countLabel} class="badge-count"></lightning-badge>
                    </template>
                </div>
                <lightning-button-group>
                    <lightning-button
                        label="30+ Days"
                        variant={thirtyDayVariant}
                        onclick={handleFilterChange}
                        data-filter="30"
                    ></lightning-button>
                    <lightning-button
                        label="60+ Days"
                        variant={sixtyDayVariant}
                        onclick={handleFilterChange}
                        data-filter="60"
                    ></lightning-button>
                    <lightning-button
                        label="90+ Days"
                        variant={ninetyDayVariant}
                        onclick={handleFilterChange}
                        data-filter="90"
                    ></lightning-button>
                    <lightning-button
                        label="Never"
                        variant={neverVariant}
                        onclick={handleFilterChange}
                        data-filter="NEVER"
                    ></lightning-button>
                </lightning-button-group>
            </div>
            <template lwc:if={hasUserOptions}>
                <div class="slds-m-bottom_small">
                    <lightning-combobox
                        label="Filter by User"
                        value={selectedUser}
                        options={userOptions}
                        onchange={handleUserFilterChange}
                    ></lightning-combobox>
                </div>
            </template>

            <template lwc:if={isLoading}>
                <div class="slds-is-relative spinner-container">
                    <lightning-spinner alternative-text="Loading accounts" size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">Warning</span>
                    <p>{errorMessage}</p>
                </div>
            </template>

            <template lwc:if={hasAccounts}>
                <div class="table-scroll-container">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <template lwc:if={isAdmin}>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Account Owner">Account Owner</div>
                                    </th>
                                </template>
                                <th scope="col">
                                    <div class="slds-truncate" title="Account Name">Account Name</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Last Contact">Last Contact</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Last Contact By">Last Contact By</div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Days Since Contact">Days Since Contact</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={accounts} for:item="acct">
                                <tr key={acct.accountId} class="slds-hint-parent">
                                    <template lwc:if={isAdmin}>
                                        <td data-label="Account Owner">
                                            <div class="slds-truncate">{acct.accountOwnerName}</div>
                                        </td>
                                    </template>
                                    <td data-label="Account Name">
                                        <div class="slds-truncate">
                                            <a href={acct.accountUrl}
                                               data-id={acct.accountId}
                                               onclick={handleNavigateToRecord}>{acct.accountName}</a>
                                        </div>
                                    </td>
                                    <td data-label="Last Contact">
                                        <div class="slds-truncate">
                                            <template lwc:if={acct.lastHumanContact}>
                                                <lightning-formatted-date-time
                                                    value={acct.lastHumanContact}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit"
                                                ></lightning-formatted-date-time>
                                            </template>
                                            <template lwc:else>
                                                <span class="slds-text-color_weak">—</span>
                                            </template>
                                        </div>
                                    </td>
                                    <td data-label="Last Contact By">
                                        <div class="slds-truncate">
                                            <template lwc:if={acct.lastHumanContactByName}>
                                                {acct.lastHumanContactByName}
                                            </template>
                                            <template lwc:else>
                                                <span class="slds-text-color_weak">—</span>
                                            </template>
                                        </div>
                                    </td>
                                    <td data-label="Days Since Contact">
                                        <div class="slds-truncate">
                                            <lightning-badge label={acct.displayDays} class={acct.daysBadgeClass}></lightning-badge>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template lwc:if={showEmptyState}>
                <div class="slds-illustration slds-illustration_small slds-p-vertical_large">
                    <div class="slds-text-longform">
                        <h3 class="slds-text-heading_medium slds-text-color_weak slds-align_absolute-center">
                            All caught up!
                        </h3>
                        <p class="slds-text-body_regular slds-text-color_weak slds-align_absolute-center">
                            No accounts need outreach for this period.
                        </p>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
